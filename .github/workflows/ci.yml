name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }

jobs:
  backend:
    name: Java build + tests (common, backend, gateway, examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      # Docker is available on GitHub-hosted runners, so the Testcontainers-based Redis test runs here.
      - run: mvn -B verify

  frontend:
    name: Angular build + tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx jest --ci
      - run: npx ng build --configuration production

  security-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: npm audit (production dependencies, fail on high)
        working-directory: frontend
        run: npm ci && npm audit --omit=dev --audit-level=high
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: OWASP Dependency-Check (advisory)
        continue-on-error: true
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=9 -DnvdApiKey=${{ secrets.NVD_API_KEY }}

  e2e:
    name: Docker Compose smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create throw-away .env with random secrets (never committed)
        run: |
          cat > .env <<EOT
          MSSQL_SA_PASSWORD=Sa$(openssl rand -hex 12)A1
          DB_PASSWORD=App$(openssl rand -hex 12)A1
          REDIS_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')
          API_KEY_PEPPER=$(openssl rand -base64 48 | tr -d '\n')
          GATEWAY_TOKEN=$(openssl rand -hex 24)
          BOOTSTRAP_ADMIN_EMAIL=admin@example.com
          BOOTSTRAP_ADMIN_PASSWORD=Adm$(openssl rand -hex 10)Z9
          EOT
      - run: docker compose up -d --build
      - run: ./scripts/smoke-test.sh
      - if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v
