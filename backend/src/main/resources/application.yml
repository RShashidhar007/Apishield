server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  error:
    include-stacktrace: never
    include-message: never
spring:
  application.name: apishield-backend
  lifecycle.timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=apishield;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:apishield_app}
    password: ${DB_PASSWORD}
    hikari: { maximum-pool-size: 20, connection-timeout: 10000 }
  jpa:
    open-in-view: false
    # Flyway owns the schema. Hibernate 'validate' is deliberately off until the mapping has been verified against a real SQL Server
    # (NVARCHAR/DATETIME2 type-code strictness); see docs/IMPLEMENTATION_STATUS.md.
    hibernate.ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP   # map Instant to DATETIME2 (UTC), not DATETIMEOFFSET
      hibernate.jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jackson:
    default-property-inclusion: non_null
    serialization.write-dates-as-timestamps: false
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
  endpoint.health.show-details: never
springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html
apishield:
  jwt:
    secret: ${JWT_SECRET}                 # >= 32 bytes, required, shared with the gateway
    issuer: ${JWT_ISSUER:apishield}
    audience: ${JWT_AUDIENCE:apishield-clients}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
  gateway-token: ${GATEWAY_TOKEN}         # shared secret for /internal/** (gateway -> management)
  api-key-pepper: ${API_KEY_PEPPER}       # >= 32 chars, required, shared with the gateway
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  destination:
    allowed-hosts: ${ALLOWED_UPSTREAM_HOSTS:catalog-service,order-service}
    allowed-ports: ${ALLOWED_UPSTREAM_PORTS:}
    allow-private-for-allowed-hosts: ${ALLOW_PRIVATE_UPSTREAMS:true}
    allow-loopback: ${ALLOW_LOOPBACK_UPSTREAMS:false}
  login:
    max-failed-attempts: 5
    lock-minutes: 15
  detection:
    window-minutes: 10
    auth-failure-threshold: 5
    rate-limit-threshold: 20
    blocked-request-threshold: 10
    large-request-threshold: 3
  retention:
    request-log-days: ${RETENTION_REQUEST_LOG_DAYS:30}
    security-event-days: ${RETENTION_SECURITY_EVENT_DAYS:180}
