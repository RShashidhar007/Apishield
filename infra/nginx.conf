# Serves the Angular app and reverse-proxies the management API and the gateway on ONE origin (no CORS needed, strict CSP possible).
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Add Strict-Transport-Security at the TLS-terminating edge in production.

  # Internal gateway<->management endpoints must never be reachable from the public ingress.
  location ^~ /internal/ { return 404; }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
    proxy_set_header X-Request-Id $http_x_request_id;
    client_max_body_size 1m;
  }

  location /gateway/ {
    proxy_pass http://gateway:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_read_timeout 65s;
    client_max_body_size 50m;                         # per-API limits are enforced by the gateway
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
  location ~* \.(?:js|css|svg|ico|woff2?)$ { expires 1y; add_header Cache-Control "public, immutable"; }
}
